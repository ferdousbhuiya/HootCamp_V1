name: Skills Pathfinder CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-pathfinder-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend modules
        run: python -m py_compile main.py server.py recommendation_engine.py certificate_verification.py career_catalog_extended.py
      - name: Run backend unit tests
        run: python -m unittest -v test_recommendation_engine.py test_certificate_verification.py test_extended_catalog.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Skills-Pathfinder-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Skills-Pathfinder-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: ''
        run: npm run build
