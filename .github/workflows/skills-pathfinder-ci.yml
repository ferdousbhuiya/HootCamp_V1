name: Skills Pathfinder CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  finalize_certificate_storage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/skills-pathfinder-stabilize'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skills-pathfinder-stabilize
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Skills-Pathfinder-frontend/package-lock.json
      - name: Wire private certificate source-file retention
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label, allow_already=False):
              if new in text and allow_already:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          onboarding = Path('Skills-Pathfinder-frontend/src/Component/OnboardingWizard.jsx')
          text = onboarding.read_text()
          if "../lib/documentStorage" not in text:
              text = replace_once(text, "import { createClient } from '@supabase/supabase-js';\n", "import { createClient } from '@supabase/supabase-js';\nimport { deletePrivateDocument, uploadPrivateDocument } from '../lib/documentStorage';\n", 'onboarding storage import')
          if "Onboarding resume source storage failed" not in text:
              text = replace_once(text, "  const persistResume = async (data, file) => {\n    const resumeKey = `${sessionKey}:resume`;\n    const { data: analysis, error: analysisError } = await supabase.from('resume_analyses').upsert({", "  const persistResume = async (data, file) => {\n    const resumeKey = `${sessionKey}:resume`;\n    let storagePath = null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-resumes' });\n      } catch (storageError) {\n        console.error('Onboarding resume source storage failed:', storageError);\n        storageWarning = 'Resume analysis was saved, but the original file could not be stored.';\n      }\n    }\n    const { data: analysis, error: analysisError } = await supabase.from('resume_analyses').upsert({", 'onboarding resume storage prelude')
              text = replace_once(text, "      document_type: 'resume',\n      raw_analysis: data\n", "      document_type: 'resume',\n      raw_analysis: data,\n      storage_bucket: 'student-resumes',\n      storage_path: storagePath\n", 'onboarding resume storage fields')
              text = replace_once(text, "    return { ...data, saved_analysis_id: analysis.id, client_record_key: resumeKey };\n", "    return { ...data, saved_analysis_id: analysis.id, client_record_key: resumeKey, storage_path: storagePath, storage_warning: storageWarning };\n", 'onboarding resume storage return')
          if "Onboarding certificate source storage failed" not in text:
              text = replace_once(text, "  const persistCertificate = async (cert, itemKey) => {\n    const certKey = `${sessionKey}:cert:${itemKey}`;\n", "  const persistCertificate = async (cert, itemKey, file = null) => {\n    const certKey = `${sessionKey}:cert:${itemKey}`;\n    let storagePath = cert.storage_path || null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-certificates' });\n      } catch (storageError) {\n        console.error('Onboarding certificate source storage failed:', storageError);\n        storageWarning = 'Certificate findings were saved, but the original file could not be stored.';\n      }\n    }\n", 'onboarding certificate storage prelude')
              text = replace_once(text, "      certificate_file_url: null,\n      is_verified: Boolean(cert.is_verified),", "      certificate_file_url: null,\n      storage_bucket: 'student-certificates',\n      storage_path: storagePath,\n      is_verified: Boolean(cert.is_verified),", 'onboarding certificate storage fields')
              text = replace_once(text, "    return { ...cert, saved_id: saved.id, item_key: itemKey, client_record_key: certKey };\n", "    return { ...cert, saved_id: saved.id, item_key: itemKey, client_record_key: certKey, storage_bucket: 'student-certificates', storage_path: storagePath, storage_warning: storageWarning };\n", 'onboarding certificate storage return')
              text = replace_once(text, "        const saved = await persistCertificate({ ...data, original_filename: file.name }, itemKey);\n", "        const saved = await persistCertificate({ ...data, original_filename: file.name }, itemKey, file);\n", 'onboarding certificate upload call')
              text = replace_once(text, "        const { error } = await supabase.from('saved_certifications').delete().eq('id', cert.saved_id).eq('user_id', user.id);\n        if (error) throw error;\n", "        const { error } = await supabase.from('saved_certifications').delete().eq('id', cert.saved_id).eq('user_id', user.id);\n        if (error) throw error;\n        if (cert.storage_path) {\n          try {\n            await deletePrivateDocument({ supabase, bucket: cert.storage_bucket || 'student-certificates', path: cert.storage_path });\n          } catch (storageError) {\n            console.error('Certificate storage cleanup failed:', storageError);\n          }\n        }\n", 'onboarding certificate delete cleanup')
          onboarding.write_text(text)

          dashboard = Path('Skills-Pathfinder-frontend/src/Component/UserDashboard.jsx')
          text = dashboard.read_text()
          if "../lib/documentStorage" not in text:
              text = replace_once(text, "import CareerReport from './CareerReport';\n", "import CareerReport from './CareerReport';\nimport { deletePrivateDocument, uploadPrivateDocument } from '../lib/documentStorage';\n", 'dashboard storage import')
          if "Certificate source document storage failed" not in text:
              text = replace_once(text, "  const persistCertificate = async (result, rawExtraction = result) => {\n    const row = {", "  const persistCertificate = async (result, rawExtraction = result, file = null) => {\n    let storagePath = null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-certificates' });\n      } catch (storageError) {\n        console.error('Certificate source document storage failed:', storageError);\n        storageWarning = 'Certificate findings were saved, but the original certificate file could not be stored.';\n      }\n    }\n    const row = {", 'dashboard certificate storage prelude')
              text = replace_once(text, "      verification_url: result.verification_url || null,\n      is_verified: Boolean(result.is_verified),", "      verification_url: result.verification_url || null,\n      certificate_file_url: null,\n      storage_bucket: 'student-certificates',\n      storage_path: storagePath,\n      is_verified: Boolean(result.is_verified),", 'dashboard certificate storage fields')
              text = replace_once(text, "    await persistCertificateSkills(saved, result.extracted_skills || []);\n    return saved;\n", "    await persistCertificateSkills(saved, result.extracted_skills || []);\n    return { ...saved, storage_warning: storageWarning };\n", 'dashboard certificate storage return')
              text = replace_once(text, "        savedRows.push(await persistCertificate(result));\n", "        savedRows.push(await persistCertificate(result, result, file));\n", 'dashboard certificate upload call')
              text = replace_once(text, "  const handleDeleteCert = async (id) => {\n    if (!window.confirm('Delete this certificate record? Skills learned from other sources will remain.')) return;\n    const { error } = await supabase.from('saved_certifications').delete().eq('id', id);\n    if (error) return showMessage(`Certificate could not be deleted: ${error.message}`, 'error');\n    setCertifications((current) => current.filter((cert) => cert.id !== id));\n  };", "  const handleDeleteCert = async (id) => {\n    if (!window.confirm('Delete this certificate record? Skills learned from other sources will remain.')) return;\n    const certificate = certifications.find((cert) => cert.id === id);\n    const { error } = await supabase.from('saved_certifications').delete().eq('id', id);\n    if (error) return showMessage(`Certificate could not be deleted: ${error.message}`, 'error');\n    setCertifications((current) => current.filter((cert) => cert.id !== id));\n    if (certificate?.storage_path) {\n      try {\n        await deletePrivateDocument({ supabase, bucket: certificate.storage_bucket || 'student-certificates', path: certificate.storage_path });\n      } catch (storageError) {\n        console.error('Certificate storage cleanup failed:', storageError);\n        showMessage('Certificate record deleted, but its private source file could not be removed. Please retry storage cleanup later.', 'error');\n        return;\n      }\n    }\n    showMessage('Certificate deleted.');\n  };", 'dashboard certificate delete cleanup')
          dashboard.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: Skills-Pathfinder-frontend
        run: npm ci
      - name: Build frontend with finalized storage flow
        working-directory: Skills-Pathfinder-frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: ''
        run: npm run build
      - name: Commit storage finalization if needed
        run: |
          if git diff --quiet; then
            echo 'Certificate source-file retention already finalized.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Skills-Pathfinder-frontend/src/Component/OnboardingWizard.jsx Skills-Pathfinder-frontend/src/Component/UserDashboard.jsx
          git commit -m 'chore(cert-storage): wire private certificate binaries'
          git push origin HEAD:agent/skills-pathfinder-stabilize

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-pathfinder-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skills-pathfinder-backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m py_compile main.py server.py recommendation_engine.py certificate_verification.py career_catalog_extended.py market_intelligence.py
      - name: Run backend unit tests
        run: python -m unittest -v test_recommendation_engine.py test_certificate_verification.py test_extended_catalog.py test_market_intelligence.py
      - name: Import production FastAPI application
        env:
          GROQ_API_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_KEY: ''
          TESSERACT_CMD: tesseract
        run: |
          python - <<'PY'
          import server
          assert server.app.title == 'Skills Pathfinder API'
          paths = {route.path for route in server.app.routes}
          required = {
              '/', '/health', '/api/upload', '/api/recommendations',
              '/api/verify-certificate', '/api/verify-certificate-link',
              '/api/generate-career-advice', '/api/career-advisor',
              '/api/market-data'
          }
          missing = required - paths
          assert not missing, f'Missing API routes: {sorted(missing)}'
          print('FastAPI production app imported successfully')
          print('Validated routes:', ', '.join(sorted(required)))
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Skills-Pathfinder-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Skills-Pathfinder-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: ''
        run: npm run build
      - name: Install Chromium for visual smoke test
        run: npx --yes playwright@1.55.0 install chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/skills-pathfinder-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/skills-pathfinder-preview.log
          exit 1
      - name: Capture desktop landing page
        run: npx --yes playwright@1.55.0 screenshot --viewport-size="1440,1000" --wait-for-timeout=1200 http://127.0.0.1:4173 auth-desktop.png
      - name: Capture mobile landing page
        run: npx --yes playwright@1.55.0 screenshot --viewport-size="390,844" --wait-for-timeout=1200 http://127.0.0.1:4173 auth-mobile.png
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: skills-pathfinder-ui-screenshots
          path: |
            Skills-Pathfinder-frontend/auth-desktop.png
            Skills-Pathfinder-frontend/auth-mobile.png
          retention-days: 14
