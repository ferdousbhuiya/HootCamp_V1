name: Finalize Certificate Storage

on:
  push:
    branches:
      - agent/skills-pathfinder-stabilize

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore(cert-storage): wire private certificate binaries') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skills-pathfinder-stabilize
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Skills-Pathfinder-frontend/package-lock.json
      - name: Patch certificate storage paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # OnboardingWizard
          path = Path('Skills-Pathfinder-frontend/src/Component/OnboardingWizard.jsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import { createClient } from '@supabase/supabase-js';\n",
              "import { createClient } from '@supabase/supabase-js';\nimport { deletePrivateDocument, uploadPrivateDocument } from '../lib/documentStorage';\n",
              'onboarding import'
          )
          text = replace_once(
              text,
              "  const persistResume = async (data, file) => {\n    const resumeKey = `${sessionKey}:resume`;\n    const { data: analysis, error: analysisError } = await supabase.from('resume_analyses').upsert({",
              "  const persistResume = async (data, file) => {\n    const resumeKey = `${sessionKey}:resume`;\n    let storagePath = null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-resumes' });\n      } catch (storageError) {\n        console.error('Onboarding resume source storage failed:', storageError);\n        storageWarning = 'Resume analysis was saved, but the original file could not be stored.';\n      }\n    }\n    const { data: analysis, error: analysisError } = await supabase.from('resume_analyses').upsert({",
              'onboarding resume storage prelude'
          )
          text = replace_once(
              text,
              "      document_type: 'resume',\n      raw_analysis: data\n",
              "      document_type: 'resume',\n      raw_analysis: data,\n      storage_bucket: 'student-resumes',\n      storage_path: storagePath\n",
              'onboarding resume storage fields'
          )
          text = replace_once(
              text,
              "    return { ...data, saved_analysis_id: analysis.id, client_record_key: resumeKey };\n  };\n\n  const persistCertificate = async (cert, itemKey) => {\n    const certKey = `${sessionKey}:cert:${itemKey}`;\n",
              "    return { ...data, saved_analysis_id: analysis.id, client_record_key: resumeKey, storage_path: storagePath, storage_warning: storageWarning };\n  };\n\n  const persistCertificate = async (cert, itemKey, file = null) => {\n    const certKey = `${sessionKey}:cert:${itemKey}`;\n    let storagePath = cert.storage_path || null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-certificates' });\n      } catch (storageError) {\n        console.error('Onboarding certificate source storage failed:', storageError);\n        storageWarning = 'Certificate findings were saved, but the original file could not be stored.';\n      }\n    }\n",
              'onboarding certificate storage prelude'
          )
          text = replace_once(
              text,
              "      certificate_file_url: null,\n      is_verified: Boolean(cert.is_verified),",
              "      certificate_file_url: null,\n      storage_bucket: 'student-certificates',\n      storage_path: storagePath,\n      is_verified: Boolean(cert.is_verified),",
              'onboarding certificate storage fields'
          )
          text = replace_once(
              text,
              "    return { ...cert, saved_id: saved.id, item_key: itemKey, client_record_key: certKey };\n",
              "    return { ...cert, saved_id: saved.id, item_key: itemKey, client_record_key: certKey, storage_path: storagePath, storage_warning: storageWarning };\n",
              'onboarding certificate storage return'
          )
          text = replace_once(
              text,
              "        const saved = await persistCertificate({ ...data, original_filename: file.name }, itemKey);\n",
              "        const saved = await persistCertificate({ ...data, original_filename: file.name }, itemKey, file);\n",
              'onboarding certificate upload call'
          )
          text = replace_once(
              text,
              "      if (cert.saved_id) {\n        await removeSkillSource(cert.saved_id);\n        const { error } = await supabase.from('saved_certifications').delete().eq('id', cert.saved_id).eq('user_id', user.id);\n        if (error) throw error;\n      }",
              "      if (cert.saved_id) {\n        await removeSkillSource(cert.saved_id);\n        const { error } = await supabase.from('saved_certifications').delete().eq('id', cert.saved_id).eq('user_id', user.id);\n        if (error) throw error;\n        if (cert.storage_path) {\n          try {\n            await deletePrivateDocument({ supabase, bucket: cert.storage_bucket || 'student-certificates', path: cert.storage_path });\n          } catch (storageError) {\n            console.error('Certificate storage cleanup failed:', storageError);\n          }\n        }\n      }",
              'onboarding certificate delete cleanup'
          )
          path.write_text(text)

          # UserDashboard
          path = Path('Skills-Pathfinder-frontend/src/Component/UserDashboard.jsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import CareerReport from './CareerReport';\n",
              "import CareerReport from './CareerReport';\nimport { deletePrivateDocument, uploadPrivateDocument } from '../lib/documentStorage';\n",
              'dashboard import'
          )
          text = replace_once(
              text,
              "  const persistCertificate = async (result, rawExtraction = result) => {\n    const row = {",
              "  const persistCertificate = async (result, rawExtraction = result, file = null) => {\n    let storagePath = null;\n    let storageWarning = null;\n    if (file) {\n      try {\n        storagePath = await uploadPrivateDocument({ supabase, userId: user.id, file, bucket: 'student-certificates' });\n      } catch (storageError) {\n        console.error('Certificate source document storage failed:', storageError);\n        storageWarning = 'Certificate findings were saved, but the original certificate file could not be stored.';\n      }\n    }\n    const row = {",
              'dashboard certificate storage prelude'
          )
          text = replace_once(
              text,
              "      verification_url: result.verification_url || null,\n      is_verified: Boolean(result.is_verified),",
              "      verification_url: result.verification_url || null,\n      certificate_file_url: null,\n      storage_bucket: 'student-certificates',\n      storage_path: storagePath,\n      is_verified: Boolean(result.is_verified),",
              'dashboard certificate storage fields'
          )
          text = replace_once(
              text,
              "    await persistCertificateSkills(saved, result.extracted_skills || []);\n    return saved;\n",
              "    await persistCertificateSkills(saved, result.extracted_skills || []);\n    return { ...saved, storage_warning: storageWarning };\n",
              'dashboard certificate storage return'
          )
          text = replace_once(
              text,
              "        savedRows.push(await persistCertificate(result));\n",
              "        savedRows.push(await persistCertificate(result, result, file));\n",
              'dashboard certificate upload call'
          )
          text = replace_once(
              text,
              "  const handleDeleteCert = async (id) => {\n    if (!window.confirm('Delete this certificate record? Skills learned from other sources will remain.')) return;\n    const { error } = await supabase.from('saved_certifications').delete().eq('id', id);\n    if (error) return showMessage(`Certificate could not be deleted: ${error.message}`, 'error');\n    setCertifications((current) => current.filter((cert) => cert.id !== id));\n  };",
              "  const handleDeleteCert = async (id) => {\n    if (!window.confirm('Delete this certificate record? Skills learned from other sources will remain.')) return;\n    const certificate = certifications.find((cert) => cert.id === id);\n    const { error } = await supabase.from('saved_certifications').delete().eq('id', id);\n    if (error) return showMessage(`Certificate could not be deleted: ${error.message}`, 'error');\n    setCertifications((current) => current.filter((cert) => cert.id !== id));\n    if (certificate?.storage_path) {\n      try {\n        await deletePrivateDocument({ supabase, bucket: certificate.storage_bucket || 'student-certificates', path: certificate.storage_path });\n      } catch (storageError) {\n        console.error('Certificate storage cleanup failed:', storageError);\n        showMessage('Certificate record deleted, but its private source file could not be removed. Please retry storage cleanup later.', 'error');\n        return;\n      }\n    }\n    showMessage('Certificate deleted.');\n  };",
              'dashboard certificate delete cleanup'
          )
          path.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: Skills-Pathfinder-frontend
        run: npm ci
      - name: Build frontend after patch
        working-directory: Skills-Pathfinder-frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: ''
        run: npm run build
      - name: Commit finalized certificate storage
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Skills-Pathfinder-frontend/src/Component/OnboardingWizard.jsx Skills-Pathfinder-frontend/src/Component/UserDashboard.jsx
          git commit -m 'chore(cert-storage): wire private certificate binaries'
          git push origin HEAD:agent/skills-pathfinder-stabilize
